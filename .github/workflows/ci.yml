name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build, test and verify
        run: ./gradlew build verifyPlugin --stacktrace

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: |
            build/reports/tests/test
            build/test-results/test
          retention-days: 7

      - name: Publish plugin verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-verifier-${{ matrix.os }}
          path: build/reports/pluginVerifier
          retention-days: 7

  security:
    name: Security suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run the security suite
        run: ./gradlew test -PsecurityOnly --stacktrace

      - name: Publish security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-results-${{ matrix.os }}
          path: build/reports/tests/test
          retention-days: 7

pluginGroup = io.prumo.mcp
pluginName = Prumo MCP
pluginVersion = 0.1.0-rc.14

# Alvo: IntelliJ IDEA Community 2026.1. O plugin declara suporte a Community e Ultimate;
# compilar contra IC garante que nada do caminho critico dependa de API exclusiva do Ultimate.
platformType = IC
platformVersion = 2026.1

pluginSinceBuild = 261

# A plataforma 2026.1 e compilada para bytecode Java 21 (major 65), embora a JBR seja 25.
javaToolchainVersion = 25
javaTargetVersion = 21

org.gradle.jvmargs = -Xmx3g -XX:MaxMetaspaceSize=768m
org.gradle.configuration-cache = true

# Desligado de proposito, pela segunda vez e agora com prova. Em 2026-09-05, depois de acrescentar
# um parametro a `Workspace`, `clean test` falhou 34 testes com NoSuchMethodError apontando para a
# assinatura antiga, e `clean test --no-build-cache` passou os 132 no mesmo estado de fonte: o cache
# restaurava saida de `compileTestKotlin` anterior a mudanca de ABI. Num projeto em que teste de
# seguranca bloqueia entrega, suite que roda contra bytecode antigo e pior que build lento.
org.gradle.caching = false
kotlin.stdlib.default.dependency = false
kotlin.jvm.target.validation.mode = warning

# Desligado de proposito. O file-system watching marcava compileKotlin como UP-TO-DATE depois de
# arquivos alterados por fora do Gradle (editor externo, script, agente), e a suite rodava contra
# bytecode antigo: NoSuchMethodError em alguns testes e, pior, verde em outros. Num projeto em que
# teste de seguranca bloqueia entrega, um resultado em que nao se confia custa mais que a
# reverificacao de arquivos a cada build.
org.gradle.vfs.watch = false
